<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowD" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrowP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e8833a"/>
    </marker>
    <marker id="arrowBack" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#51cf66"/>
    </marker>
    <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#ff6b6b"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="8" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#333">双螺旋在原型验证节点的运行逻辑</text>
  <text x="180" y="52" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="bold" fill="#4a90d9">设计线</text>
  <text x="540" y="52" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="bold" fill="#e8833a">原型线</text>
  <rect x="30" y="66" width="300" height="38" rx="8" fill="#e8f0fb" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="89" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#2c5f8a">Step 1：概念孵化</text>
  <line x1="180" y1="105" x2="180" y2="116" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <rect x="30" y="120" width="300" height="38" rx="8" fill="#e8f0fb" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="143" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#2c5f8a">Step 2：One-Pager（轻量设计概要）</text>
  <line x1="335" y1="139" x2="384" y2="139" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowD)" stroke-dasharray="6,3"/>
  <text x="360" y="133" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#4a90d9">One-Pager 指引原型方向</text>
  <line x1="180" y1="159" x2="180" y2="170" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <rect x="30" y="174" width="300" height="38" rx="8" fill="#dae8f7" stroke="#4a90d9" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="180" y="197" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#1e4a6b">Step 3：原型验证（双线交汇节点）</text>
  <rect x="390" y="174" width="300" height="38" rx="8" fill="#fef0e6" stroke="#e8833a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="192" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#b85a1e">A. 纸上原型 → B. Toy First</text>
  <text x="540" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#e8833a">单机制验证（1-3天）</text>
  <line x1="540" y1="213" x2="540" y2="222" stroke="#e8833a" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <rect x="390" y="226" width="300" height="38" rx="8" fill="#fef0e6" stroke="#e8833a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="244" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#b85a1e">C. Toy→Game → D. Juicy</text>
  <text x="540" y="257" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#e8833a">向 MVP 收敛（1-2天）</text>
  <line x1="540" y1="265" x2="540" y2="274" stroke="#e8833a" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <rect x="390" y="278" width="300" height="38" rx="8" fill="#faece3" stroke="#e8833a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="540" y="296" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#b85a1e">Playtest → 结果判断</text>
  <text x="540" y="309" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#e8833a">5 个不认识的目标玩家</text>
  <path d="M 390 297 L 340 297 L 340 270 L 336 270" stroke="#51cf66" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="372" y="290" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="bold" fill="#51cf66">好玩 ✓</text>
  <text x="372" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#51cf66">进入 Step 4</text>
  <path d="M 390 297 L 300 297 L 300 158 L 250 158 L 250 139 L 336 139" stroke="#e8a838" stroke-width="2.5" fill="none" marker-end="url(#arrowBack)"/>
  <text x="284" y="292" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="bold" fill="#e8a838">不清晰</text>
  <text x="284" y="306" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#e8a838">回流 Step 2</text>
  <path d="M 390 297 L 260 297 L 260 85 L 336 85" stroke="#ff6b6b" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="245" y="292" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="bold" fill="#ff6b6b">不好玩</text>
  <text x="245" y="306" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#ff6b6b">回流 Step 1</text>
  <rect x="30" y="332" width="660" height="76" rx="8" fill="#fff5f5" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="352" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#cc3333">⚡ Kill Criteria（退出条件）</text>
  <text x="60" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#cc3333">• 连续 3 轮测试者无法理解核心玩法 → 停止 ｜ 连续 3 轮迭代后测试者仍然没兴趣 → 停止项目</text>
  <text x="60" y="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#cc3333">• 市场反馈极弱（数周无人关注）→ 重新评估定位 ｜ 一个核心机制验证超过 1 个月 → 拆分问题</text>
</svg>