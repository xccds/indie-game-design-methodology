<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <defs>
    <marker id="arrowX" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#555"/>
    </marker>
    <linearGradient id="anxietyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="boredomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bbdefb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <rect width="680" height="420" rx="8" fill="#fafafa"/>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#333">心流通道（Flow Channel）</text>

  <!-- Anxiety zone (upper-left triangle) -->
  <polygon points="70,50 70,230 340,50" fill="url(#anxietyGrad)"/>

  <!-- Boredom zone (lower-right triangle) -->
  <polygon points="340,370 640,370 640,230" fill="url(#boredomGrad)"/>

  <!-- Flow channel (diagonal band from bottom-left to top-right) -->
  <polygon points="70,280 70,340 640,130 640,70" fill="url(#flowGrad)" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Flow channel center line -->
  <line x1="70" y1="310" x2="640" y2="100" stroke="#43a047" stroke-width="2.5"/>

  <!-- Flow channel label -->
  <text x="355" y="210" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">心 流 通 道</text>

  <!-- Flow channel arrow -->
  <polygon points="480,130 486,122 490,130" fill="#43a047"/>

  <!-- Skills growth arrow -->
  <text x="390" y="225" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#66bb6a">玩家的技能提升 →</text>

  <!-- Anxiety zone labels -->
  <text x="190" y="80" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#c62828">焦虑区</text>
  <text x="190" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#e57373">挑战 &gt; 技能：太难</text>

  <!-- Boredom zone labels -->
  <text x="520" y="340" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#1565c0">无聊区</text>
  <text x="520" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#64b5f6">技能 &gt; 挑战：太简单</text>

  <!-- Axes -->
  <line x1="70" y1="50" x2="70" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <line x1="70" y1="370" x2="640" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrowX)"/>

  <!-- Y-axis labels -->
  <text x="18" y="210" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#555" transform="rotate(-90,18,210)">难度（Challenge）</text>
  <text x="58" y="80" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#999">高</text>
  <text x="58" y="365" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#999">低</text>

  <!-- X-axis labels -->
  <text x="355" y="398" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#555">玩家技能（Skill）</text>
  <text x="100" y="392" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#999">低</text>
  <text x="600" y="392" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#999">高</text>

  <!-- Zigzag skill curve -->
  <polyline points="90,340 120,330 150,345 180,332 210,348 240,338 270,350 300,340 330,355 360,345 390,355 420,348 450,360 480,350 510,365 540,355 570,368 600,360"
            fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>

  <text x="612" y="358" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#ff9800" opacity="0.5">实际技能波动</text>

  <!-- Flow zone edge annotations -->
  <text x="200" y="175" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#e57373" opacity="0.7">挑战过高 → 焦虑</text>
  <text x="420" y="300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#64b5f6" opacity="0.7">挑战过低 → 无聊</text>

  <!-- Legend -->
  <rect x="80" y="378" width="130" height="16" rx="3" fill="#ffebee" stroke="#ef9a9a" stroke-width="0.5"/>
  <text x="145" y="390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#c62828">焦虑区</text>
  <rect x="225" y="378" width="130" height="16" rx="3" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="290" y="390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#2e7d32">心流通道</text>
  <rect x="370" y="378" width="130" height="16" rx="3" fill="#e3f2fd" stroke="#90caf9" stroke-width="0.5"/>
  <text x="435" y="390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#1565c0">无聊区</text>
  <line x1="520" y1="386" x2="550" y2="386" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5"/>
  <text x="560" y="390" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9" fill="#ff9800" opacity="0.5">技能波动</text>
</svg>